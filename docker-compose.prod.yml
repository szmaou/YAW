# YAW — production stack (Docker-only deploy).
# Dipakai via: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# docker-compose.yml (dev) TIDAK diubah — alur dev tetap `docker compose up -d` + npm run dev.
# DB internal saja (tanpa published ports). Backend env via .env.prod (lihat .env.prod.example).

services:
  yaw-db:
    image: mariadb:11.4
    container_name: yaw-prod-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-yaw}
      MARIADB_USER: ${DB_USER:-yaw_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env.prod}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env.prod}
    volumes:
      - yaw_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  yaw-backend:
    build:
      context: ./backend
    container_name: yaw-prod-backend
    restart: unless-stopped
    environment:
      APP_PORT: 3002
      APP_ENV: production
      DB_HOST: yaw-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-yaw}
      DB_USER: ${DB_USER:-yaw_user}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env.prod}
      JWT_SECRET: ${JWT_SECRET:?Isi JWT_SECRET di .env.prod}
      UPLOAD_PATH: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    expose:
      - "3002"
    volumes:
      - yaw-uploads:/app/uploads
    depends_on:
      yaw-db:
        condition: service_healthy

  yaw-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        API_BASE_URL: ${API_BASE_URL:?Isi API_BASE_URL di .env.prod}
        BASE_HREF: ${BASE_HREF:-/}
    container_name: yaw-prod-web
    restart: unless-stopped
    ports:
      # Host port bisa diganti via WEB_PORT di .env.prod bila 80 sudah dipakai.
      - "${WEB_PORT:-80}:80"
      # HTTPS: terminasi TLS di host (certbot) atau reverse-proxy di depan container ini.
      # Contoh: setelah certbot --nginx, biarkan mapping port + mapping 443 berikut.
      # - "443:443"
    depends_on:
      - yaw-backend

volumes:
  yaw_data:
  yaw-uploads:
