# YAW web — nginx: serve Flutter web + proxy API/uploads ke backend.
# Tanpa domain hardcode; TLS di-terminasi di host/reverse-proxy (lihat docs/DEPLOY-DOCKER.md).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # API + uploads diteruskan ke service backend (DNS internal compose).
    location /api/ {
        proxy_pass http://yaw-backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://yaw-backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — route GoRouter (/#/... atau path) selalu ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
