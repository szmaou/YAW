name: yaw
description: "YAW — Futuristic Automotive Marketplace. Flutter + REST API + MariaDB."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  dio: ^5.7.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.3
  cached_network_image: ^4.0.0
  intl: ^0.20.2
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  shimmer: ^4.0.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^4.0.1
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
